  - aid: asce-amplify:arcgis-rest-services
    name: ASCE GIS REST Services
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/asce-amplify.png
    description: >-
      The ASCE ArcGIS Server instance at gis.asce.org publishes the hazard map,
      image and geoprocessing services that back the ASCE Hazard Tool — ASCE 7
      wind, ice, snow, seismic, tsunami and tornado layers, NOAA precipitation
      tiles, DEM mosaics and NAVD88 profile services. The Esri GeoServices REST
      surface answers anonymously at /arcgis/rest/services with f=json, and the
      same services are also published as SOAP endpoints described by WSDL. The
      HTML Services Directory is disabled by the administrator (403); the JSON
      representation is the readable contract.
    humanURL: https://gis.asce.org/arcgis/rest/services?f=json
    baseURL: https://gis.asce.org/arcgis/rest/services
