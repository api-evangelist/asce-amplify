specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: ASCE Amplify
providerId: asce-amplify
created: '2026-05-04'
modified: '2026-09-07'
generated: '2026-09-07'
method: searched
source: https://www.asce.org/publications-and-news/asce-hazard-tool/api
supersedes: >-
  A 2026-05-04 bulk-sweep scaffold that invented free/professional/enterprise
  tiers, per-minute limits and burst ceilings ASCE has never published. Replaced
  2026-09-07 with the one limit the provider actually documents.
tags:
  - Civil Engineering
  - Hazard Data
  - Rate Limiting
  - Quotas
description: >-
  Published rate limits for the ASCE Hazard Loads API. ASCE documents a single
  monthly request allowance per API key and reports consumption inside the
  response body; it publishes no per-second or per-minute rate, no burst
  allowance, and no rate-limit response headers.
limit_count: 1
headers:
  limit: null
  remaining: null
  reset: null
  retryAfter: null
  policy: null
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header is documented, and none
    was observed. The only runtime consumption signal is in the response body.
body_signal:
  field: requestInfo.currentMonthlyRequestNumber
  format: '"<requests used>/<monthly allowance>"'
  example: '"69/1000"'
  source: https://www.asce.org/publications-and-news/asce-hazard-tool/api
  note: >-
    Present on successful responses only, so a client learns its remaining
    allowance from a 200 body rather than from headers on any response.
responseCodes:
  quotaExceeded: 500
  note: >-
    ASCE documents "Code 500: over query limit" — quota exhaustion returns a 500,
    not a 429. There is no documented 429 on this API.
limits:
  - name: Default monthly request allowance
    scope: api-key
    metric: requests
    limit: 1000
    timeFrame: month
    burst: null
    applies:
      - ASCE Hazard Tool API
    evidence: >-
      The sample response published on the API documentation page reports
      requestInfo.currentMonthlyRequestNumber "69/1000", and the page states
      "If you need a higher usage limit, please contact us to make special
      arrangements."
    source: https://www.asce.org/publications-and-news/asce-hazard-tool/api
policies:
  - name: Higher usage limits
    description: >-
      Higher allowances are arranged individually. ASCE directs callers to the
      quote form at
      https://www.asce.org/publications-and-news/asce-hazard-tool/request-a-quote
      or to contact ASCE Publications; no negotiated ceiling is published.
  - name: Undocumented request rate
    description: >-
      ASCE publishes no per-second or per-minute request rate, and no burst
      policy. Recorded as absent rather than estimated.
gis_surface:
  api: ASCE GIS REST Services
  limits_published: false
  note: >-
    No rate limits are published for the anonymous ArcGIS REST/SOAP services at
    gis.asce.org.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
