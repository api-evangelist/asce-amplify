supersedes: >-
  A 2026-05-04 bulk-sweep scaffold that invented Free / Professional / Enterprise
  tiers with quotas, overage units and "TBD" prices ASCE has never published.
  Replaced 2026-09-07 with the measured finding: ASCE publishes no plans.
description: >-
  ASCE publishes no public pricing or plan table for the ASCE Hazard Tool API.
  Access is quote-based: a company requests a quote, and receives its API key and
  usage allowance at sign-up. The only published quantity is the default
  allowance of 1,000 requests per month, which is a limit rather than a priced
  tier.
plan_count: 0
