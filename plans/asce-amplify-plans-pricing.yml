  pricing: quote
  public_price_list: false
  self_service_signup: false
  free_tier: false
  trial: false
  evidence:
    - url: https://www.asce.org/publications-and-news/asce-hazard-tool/api
      status: 200
      quote: >-
        "All keys are managed through the ASCE Hazard Tool Account Manager. At
        the time of sign up, your company will receive the API key. If you need a
        higher usage limit, please contact us to make special arrangements."
    - url: https://www.asce.org/publications-and-news/asce-hazard-tool/request-a-quote
      status: 200
      note: >-
        "Get pricing — Contact ASCE Publications for pricing and subscription
        information or to request a higher usage limit." No amounts, currencies,
        billing periods or included quotas are stated anywhere on the page.
notes:
  - >-
    plan_count: 0 is the measurement, not a gap in this pass. An enterprise
    "contact us" posture is a real commercial model and is recorded as such.
  - >-
    The related ASCE 7 standard subscriptions sold through ASCE AMPLIFY
    (amplify.asce.org) are content licences for the standards, not API plans, and
    are not recorded here.
